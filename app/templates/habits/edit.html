{% extends "base.html" %}
{% block title %}Редактировать привычку{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="mb-3">
            <a href="/habits/{{ habit.id }}" class="text-decoration-none text-muted small">← к привычке</a>
        </div>

        <div class="card">
            <div class="card-body p-4">
                <h1 class="h4 mb-1">Редактировать привычку</h1>
                <p class="text-muted small mb-4">Все отметки сохранятся.</p>

                {% if error %}
                    <div class="alert alert-danger py-2">{{ error }}</div>
                {% endif %}

                <form method="post" action="/habits/{{ habit.id }}/edit">
                    <div class="mb-3">
                        <label class="form-label">Название</label>
                        <input type="text" class="form-control" name="name"
                               value="{{ habit.name }}" required maxlength="100" autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Описание
                            <span class="text-muted fw-normal">— необязательно</span>
                        </label>
                        <textarea class="form-control" name="description" rows="2"
                                  maxlength="500">{{ habit.description }}</textarea>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Цвет привычки</label>
                        <input type="color" class="form-control form-control-color" name="color"
                               value="{{ habit.color }}">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                        <a href="/habits/{{ habit.id }}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
