{% extends "base.html" %}
{% block title %}Новая привычка{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="h4 mb-3">Новая привычка</h1>

                {% if error %}
                    <div class="alert alert-danger py-2">{{ error }}</div>
                {% endif %}

                <form method="post" action="/habits/new">
                    <div class="mb-3">
                        <label class="form-label">Название</label>
                        <input type="text" class="form-control" name="name"
                               value="{{ name or '' }}" required maxlength="100"
                               placeholder="Например: бегать 30 минут">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Описание <span class="text-muted">(необязательно)</span></label>
                        <textarea class="form-control" name="description" rows="2"
                                  maxlength="500">{{ description or '' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Цвет</label>
                        <input type="color" class="form-control form-control-color" name="color"
                               value="{{ color or '#22c55e' }}">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Создать</button>
                        <a href="/" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
