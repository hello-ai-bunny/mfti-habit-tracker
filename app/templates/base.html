<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Habit Tracker{% endblock %}</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    {% block head %}{% endblock %}
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Habit Tracker</a>
        {% if user %}
            <div class="d-flex gap-3 me-auto ms-3">
                <a class="nav-link text-light" href="/">Привычки</a>
                <a class="nav-link text-light" href="/stats">Статистика</a>
            </div>
        {% endif %}
        <div class="ms-auto d-flex align-items-center gap-2">
            {% if user %}
                <span class="text-light me-2">{{ user.username }}</span>
                <form action="/logout" method="post" class="m-0">
                    <button class="btn btn-outline-light btn-sm" type="submit">
                        Выйти
                    </button>
                </form>
            {% else %}
                <a class="btn btn-outline-light btn-sm" href="/login">Войти</a>
                <a class="btn btn-light btn-sm" href="/register">Регистрация</a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container py-4">
    {% block content %}{% endblock %}
</main>

</body>
</html>
